# Render Blueprint — deploy the backend + database together for free.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and creates both resources below, already wired together.
#
# The frontend is NOT included here — deploy it separately on Vercel or
# Netlify (see DEPLOY.md), since Render's free static-site tier is not as
# good a fit as those two for a Vite app.

databases:
  - name: eventflow-db
    plan: free
    databaseName: eventflow
    user: eventflow
    # Render's default Postgres version supports `CREATE EXTENSION postgis`
    # on the free tier without needing superuser (confirmed against
    # Render's extension docs) — no version pin needed here.

services:
  - type: web
    name: eventflow-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT at runtime — must bind to it, not a hardcoded port.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventflow-db
          property: connectionString
